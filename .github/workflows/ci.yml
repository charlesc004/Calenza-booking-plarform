name: Validate SERENO
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          {
            POSTGRES_USER: sereno,
            POSTGRES_PASSWORD: ci-only-password,
            POSTGRES_DB: sereno_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sereno" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sereno:ci-only-password@localhost:5432/sereno_test
      TEST_DATABASE_URL: postgresql+asyncpg://sereno:ci-only-password@localhost:5432/sereno_test
      SECRET_KEY: ci-only-non-production-key-at-least-thirty-two-characters
      ENVIRONMENT: development
      ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: pip install -r apps/api/requirements.lock
      - run: npm ci
      - run: python -m ruff check scripts/setup_env.py && python -m ruff format --check scripts/setup_env.py
      - run: python -m ruff check app scripts tests && python -m ruff format --check app scripts tests
        working-directory: apps/api
      - run: python -m alembic upgrade head && python -m pytest -q && python -m alembic check
        working-directory: apps/api
      - run: python -m scripts.export_openapi
        working-directory: apps/api
      - run: npm run contracts && git diff --exit-code apps/api/openapi.json apps/web/src/lib/api/types.generated.ts && npm run lint && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: |
          PGPASSWORD=ci-only-password createdb -h localhost -U sereno sereno_e2e
          cd apps/api
          python -m alembic upgrade head
          python -m scripts.seed
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/sereno-api.log 2>&1 &
        env:
          DATABASE_URL: postgresql+asyncpg://sereno:ci-only-password@localhost:5432/sereno_e2e
      - run: npm run dev > /tmp/sereno-web.log 2>&1 &
      - run: |
          ready=false
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health && curl --silent --fail http://localhost:5173 > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/sereno-api.log /tmp/sereno-web.log
            exit 1
          fi
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-failure
          path: |
            test-results/
            /tmp/sereno-api.log
            /tmp/sereno-web.log
