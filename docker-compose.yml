services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/setup_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-calenza}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calenza}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calenza}
      SECRET_KEY: ${SECRET_KEY:?Generate .env with scripts/setup_env.py}
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:8080:80"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  postgres_data:
