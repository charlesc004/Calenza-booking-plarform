[project]
name = "sereno-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.149,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "argon2-cffi>=23.1", "PyJWT>=2.10,<3", "email-validator>=2.2,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
